<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>Moje Nawyki</title><style>

</style></head><body><header><h1>Moje Nawyki</h1><div>Każdy dzień to krok do przodu 🌱</div></header><main><section><div class="nav"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div><div class="days" id="calendar"></div></section><section><h2 id="date"></h2><div id="habits"></div><p id="progress"></p></section><section><h2>Notatka dnia</h2><textarea id="note" placeholder="Co dziś było ważne?"></textarea></section><section><h2>Trening — 3 zdjęcia w miesiącu</h2><p class="muted">Zdjęcia zapisują się na tym urządzeniu. Duże zdjęcia mogą zająć dużo miejsca.</p><div class="photos" id="photos"></div></section><section><h2>Kopia zapasowa</h2><button id="export">Eksportuj dane</button> <button id="importBtn">Przywróć dane</button><input id="importFile" type="file" accept="application/json" hidden><p class="muted">Eksport obejmuje także zapisane zdjęcia. Zachowaj plik w bezpiecznym miejscu.</p></section></main><script>
const names=['Poranne oddychanie','50 pompek','Medytacja','Zimny prysznic','Wdzięczność','Nauka szwedzkiego','Nauka AI','Siłownia / trening','Dobry uczynek'];let data;try{data=JSON.parse(localStorage.getItem('moje-nawyki-v1'))||{}}catch{data={}};const save=()=>{try{localStorage.setItem('moje-nawyki-v1',JSON.stringify(data))}catch(e){alert('Brak miejsca na zapis. Wyeksportuj kopię danych.')}};let chosen=new Date();chosen.setHours(12,0,0,0);let shown=new Date(chosen.getFullYear(),chosen.getMonth(),1);const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,mkey=d=>key(d).slice(0,7);const el=id=>document.getElementById(id);function render(){el('month').textContent=shown.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});const c=el('calendar');c.innerHTML='';['Pn','Wt','Śr','Cz','Pt','So','Nd'].forEach(s=>{let x=document.createElement('b');x.textContent=s;c.append(x)});let offset=(shown.getDay()+6)%7;for(let i=0;i<offset;i++)c.append(document.createElement('span'));let n=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();for(let i=1;i<=n;i++){let d=new Date(shown.getFullYear(),shown.getMonth(),i),k=key(d),b=document.createElement('button');b.textContent=i;if(k===key(chosen))b.classList.add('sel');if((data[k]?.habits||[]).every(Boolean)&&data[k]?.habits?.length===names.length)b.classList.add('done');b.onclick=()=>{chosen=d;render()};c.append(b)}const k=key(chosen);el('date').textContent=chosen.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});let record=data[k]||{};el('habits').innerHTML='';names.forEach((name,i)=>{let label=document.createElement('label');label.className='habit';let input=document.createElement('input');input.type='checkbox';input.checked=!!record.habits?.[i];input.onchange=()=>{data[k]??={};data[k].habits??=Array(9).fill(false);data[k].habits[i]=input.checked;save();render()};label.append(input,document.createTextNode(name));el('habits').append(label)});el('progress').textContent=`Wykonano: ${(record.habits||[]).filter(Boolean).length} / 9`;el('note').value=record.note||'';renderPhotos()};el('note').oninput=e=>{let k=key(chosen);data[k]??={};data[k].note=e.target.value;save()};el('prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);render()};el('next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);render()};function renderPhotos(){let k='photos-'+mkey(chosen),arr=data[k]||[],wrap=el('photos');wrap.innerHTML='';for(let i=0;i<3;i++){let div=document.createElement('div');div.className='slot';if(arr[i]){let img=document.createElement('img');img.src=arr[i];img.className='photo';div.append(img);let del=document.createElement('button');del.textContent='Usuń';del.onclick=()=>{if(confirm('Usunąć zdjęcie?')){data[k][i]=null;save();renderPhotos()}};div.append(del)}let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{let f=inp.files[0];if(!f)return;let image=new Image(),url=URL.createObjectURL(f);image.onload=()=>{let scale=Math.min(1,900/Math.max(image.width,image.height)),can=document.createElement('canvas');can.width=Math.round(image.width*scale);can.height=Math.round(image.height*scale);can.getContext('2d').drawImage(image,0,0,can.width,can.height);data[k]??=[null,null,null];data[k][i]=can.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);save();renderPhotos()};image.src=url};div.append(inp);wrap.append(div)}}el('export').onclick=()=>{let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moje-nawyki-kopia-'+key(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('importBtn').onclick=()=>el('importFile').click();el('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error();if(confirm('Zastąpić obecne dane kopią?')){data=parsed;save();render()}}catch{alert('Nieprawidłowy plik kopii')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
