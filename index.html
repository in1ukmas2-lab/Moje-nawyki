<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d37"><title>Moje Nawyki</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui,sans-serif;background:#f5f7f4;color:#172c28;margin:0}main{max-width:580px;margin:auto;padding:22px}h1{margin-bottom:4px}.sub{color:#65746e}.panel{background:white;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 2px 14px #1232}header,.nav,.stats{display:flex;justify-content:space-between;align-items:center;gap:10px}button{border:0;border-radius:10px;padding:10px 15px;background:#dceae2;color:#173d37;font-size:17px;cursor:pointer}.primary{background:#173d37;color:white}#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}.day{padding:10px 0;text-align:center;background:#f0f4f0;border-radius:10px;position:relative}.day.active{background:#173d37;color:white}.day.marked:after{content:'•';position:absolute;bottom:0;left:46%;color:#36a477}.day.active:after{color:#a6e4c2}.weekday{text-align:center;color:#6a7771;font-size:12px}label.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e8eeea}input[type=checkbox]{width:22px;height:22px;accent-color:#207457}.meter{height:10px;background:#e5eee8;border-radius:20px;overflow:hidden}.fill{height:100%;background:#207457;width:0;transition:width .2s}.muted{font-size:13px;color:#6b7771}textarea{width:100%;box-sizing:border-box;border:1px solid #c9d7ce;border-radius:12px;padding:12px;font:inherit;min-height:90px}#status{font-size:12px;color:#26704e}</style></head><body><main><header><div><h1>🌿 Moje Nawyki</h1><div class="sub">Małe kroki, codziennie</div></div><span>1.0</span></header><section class="panel"><div class="nav"><button id="prev" aria-label="Poprzedni miesiąc">‹</button><strong id="month"></strong><button id="next" aria-label="Następny miesiąc">›</button></div><div id="calendar"></div></section><section class="panel"><h2 id="selected"></h2><div class="stats"><span>Dzisiejszy wynik wybranego dnia</span><strong id="progress">0/9</strong></div><div class="meter"><div class="fill" id="fill"></div></div><div id="habits"></div><p id="status" aria-live="polite">Zapisywanie automatyczne</p></section><section class="panel"><h2>Notatka z dnia</h2><textarea id="note" placeholder="Co dzisiaj było ważne?"></textarea><p class="muted">Notatka zapisuje się automatycznie na tym urządzeniu.</p></section><p class="muted">Dane są zapisane tylko w tej przeglądarce. Nie czyść danych witryny przed wykonaniem kopii zapasowej.</p></main><script>
const habits=['Poranne oddychanie','50 pompek','Medytacja','Zimny prysznic','Wdzięczność','Nauka szwedzkiego','Nauka AI','Siłownia / trening','Dobry uczynek'];
const storageKey='moje-nawyki-v1';let records={};try{records=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){records={}};
const today=new Date();let selected=new Date(today.getFullYear(),today.getMonth(),today.getDate());let view=new Date(selected.getFullYear(),selected.getMonth(),1);const el=id=>document.getElementById(id);const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const getRecord=()=>records[dateKey(selected)]||{checks:[],note:''};function save(r){records[dateKey(selected)]=r;try{localStorage.setItem(storageKey,JSON.stringify(records));el('status').textContent='✓ Zapisano na tym urządzeniu'}catch(e){el('status').textContent='Nie udało się zapisać — sprawdź pamięć przeglądarki'}}
function renderCalendar(){el('month').textContent=new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(view);const grid=el('calendar');grid.replaceChildren();['Pn','Wt','Śr','Cz','Pt','So','Nd'].forEach(t=>{let s=document.createElement('div');s.className='weekday';s.textContent=t;grid.append(s)});let first=(new Date(view.getFullYear(),view.getMonth(),1).getDay()+6)%7;for(let i=0;i<first;i++)grid.append(document.createElement('span'));let days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let i=1;i<=days;i++){let d=new Date(view.getFullYear(),view.getMonth(),i),k=dateKey(d),b=document.createElement('button');b.className='day'+(k===dateKey(selected)?' active':'')+(records[k]?.checks?.length?' marked':'');b.textContent=i;b.setAttribute('aria-label',k);b.onclick=()=>{selected=d;render()};grid.append(b)}}function renderDay(){let r=getRecord();el('selected').textContent=new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selected);el('progress').textContent=`${r.checks.length}/${habits.length}`;el('fill').style.width=`${r.checks.length/habits.length*100}%`;el('habits').replaceChildren();habits.forEach((habit,i)=>{let l=document.createElement('label');l.className='habit';let c=document.createElement('input');c.type='checkbox';c.checked=r.checks.includes(i);c.onchange=()=>{let next=getRecord();let checks=new Set(next.checks);c.checked?checks.add(i):checks.delete(i);save({...next,checks:[...checks].sort((a,b)=>a-b)});renderDay();renderCalendar()};l.append(c,document.createTextNode(habit));el('habits').append(l)});el('note').value=r.note||'';el('status').textContent='Zapisywanie automatyczne'}function render(){renderCalendar();renderDay()}el('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};el('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};el('note').oninput=e=>save({...getRecord(),note:e.target.value});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
